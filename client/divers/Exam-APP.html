<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" rel="stylesheet">
  <title>Examen de Français</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f0f4f8;
      min-height: 100vh;
      padding: 20px;
    }

    .exam-container {
      max-width: 800px;
      margin: 0 auto;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
      overflow: hidden;
    }

    .entete {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 30px;
      background: #2c3e50;
      color: #fff;
    }

    .region {
      font-size: 1.4rem;
      font-weight: 600;
    }

    .annee {
      font-size: 1.2rem;
      background: #3498db;
      padding: 5px 15px;
      border-radius: 20px;
    }

    .texte {
      padding: 30px;
      line-height: 1.8;
      color: #34495e;
      border-bottom: 2px solid #ecf0f1;
    }

    .texte p {
      margin-bottom: 15px;
      font-size: 1.1rem;
    }

    .toggle-container {
      display: flex;
      justify-content: center;
      padding: 20px;
      border-bottom: 2px solid #ecf0f1;
    }

    .toggle-btn {
      background: #3498db;
      color: #fff;
      border: none;
      padding: 12px 25px;
      border-radius: 25px;
      cursor: pointer;
      font-size: 1rem;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: background 0.3s;
    }

    .toggle-btn:hover {
      background: #2980b9;
    }

    .toggle-btn i {
      font-size: 1.2rem;
    }

    .questions {
      padding: 0 30px 30px;
      display: none;
    }

    .questions.visible {
      display: block;
    }

    .qst {
      background: #f8f9fa;
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 15px;
      border-left: 4px solid #3498db;
    }

    .qst-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .text-qst {
      flex: 1;
      font-size: 1rem;
      color: #2c3e50;
      font-weight: 500;
    }

    .icon-answer {
      width: 40px;
      height: 40px;
      background: #3498db;
      color: #fff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.3s, transform 0.2s;
      flex-shrink: 0;
      margin-left: 15px;
    }

    .icon-answer:hover {
      background: #2980b9;
      transform: scale(1.1);
    }

    .answer-area {
      margin-top: 15px;
      display: none;
      animation: fadeIn 0.3s ease;
    }

    .answer-area.visible {
      display: block;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .answer-display {
      background: #fff;
      border: 1px solid #3498db;
      border-radius: 8px;
      padding: 15px;
      color: #2c3e50;
      line-height: 1.6;
      position: relative;
    }

    .edit-icon {
      position: absolute;
      top: 10px;
      right: 10px;
      background: #3498db;
      color: #fff;
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.3s;
    }

    .edit-icon:hover {
      background: #2980b9;
    }

    .no-answer {
      color: #95a5a6;
      font-style: italic;
    }

    .affirmations-list {
      margin-top: 15px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .affirmation-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      padding: 10px 15px;
      background: #fff;
      border: 1px solid #3498db;
      border-radius: 8px;
      transition: background 0.3s;
    }

    .affirmation-text {
      flex: 1;
      color: #2c3e50;
      font-size: 0.95rem;
      line-height: 1.4;
    }

    .tf-toggle {
      width: 80px;
      height: 35px;
      border: none;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.3s, transform 0.2s;
      flex-shrink: 0;
      background: #95a5a6;
      color: #fff;
    }

    .tf-toggle:hover {
      transform: scale(1.05);
    }

    .tf-toggle.vrai {
      background: #27ae60;
    }

    .tf-toggle.faux {
      background: #e74c3c;
    }

    .qst-short {
      background: #f8f9fa;
      border-radius: 10px;
      padding: 15px 20px;
      margin-bottom: 10px;
      border-left: 4px solid #3498db;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .qst-short-row1 {
      display: flex;
      align-items: center;
    }

    .qst-short-row2 {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .qst-short-text {
      flex: 1;
      font-size: 1rem;
      color: #2c3e50;
      font-weight: 500;
    }

    .qst-short-answer {
      flex: 1;
      font-size: 0.95rem;
      color: #27ae60;
      font-weight: 500;
    }

    .qst-short .icon-answer {
      width: 36px;
      height: 36px;
      flex-shrink: 0;
    }

    .qst-short-container {
      background: #f8f9fa;
      border-radius: 10px;
      padding: 15px 20px;
      margin-bottom: 15px;
      border-left: 4px solid #3498db;
    }

    .short-items-list {
      margin-top: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .short-item-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 10px;
      background: #fff;
      border: 1px solid #3498db;
      border-radius: 8px;
    }

    .short-item-text {
      flex: 1;
      color: #2c3e50;
      font-size: 0.95rem;
    }

    .short-item-answer-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .short-item-answer {
      color: #27ae60;
      font-weight: 500;
      font-size: 0.9rem;
      min-width: 80px;
    }

    .short-item-btn {
      width: 32px;
      height: 32px;
      background: #3498db;
      color: #fff;
      border: none;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.3s, transform 0.2s;
      flex-shrink: 0;
    }

    .short-item-btn:hover {
      background: #2980b9;
      transform: scale(1.1);
    }

    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-overlay.visible {
      display: flex;
    }

    .modal {
      background: #fff;
      border-radius: 15px;
      padding: 25px;
      width: 90%;
      max-width: 600px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .modal-title {
      font-size: 1.1rem;
      color: #2c3e50;
      font-weight: 600;
    }

    .modal-close {
      background: none;
      border: none;
      font-size: 1.5rem;
      color: #95a5a6;
      cursor: pointer;
      transition: color 0.3s;
    }

    .modal-close:hover {
      color: #e74c3c;
    }

    .modal textarea {
      width: 100%;
      min-height: 150px;
      padding: 15px;
      border: 2px solid #3498db;
      border-radius: 10px;
      font-family: inherit;
      font-size: 1rem;
      resize: vertical;
      outline: none;
    }

    .modal textarea.short {
      min-height: 60px;
    }

    .modal textarea:focus {
      border-color: #2980b9;
      box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.2);
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 15px;
    }

    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.95rem;
      transition: background 0.3s;
    }

    .btn-cancel {
      background: #ecf0f1;
      color: #7f8c8d;
    }

    .btn-cancel:hover {
      background: #bdc3c7;
    }

    .btn-save {
      background: #3498db;
      color: #fff;
    }

    .btn-save:hover {
      background: #2980b9;
    }

    .exam-selector {
      max-width: 800px;
      margin: 0 auto;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
      padding: 30px;
    }

    .exam-selector h2 {
      color: #2c3e50;
      text-align: center;
      margin-bottom: 10px;
    }

    .exam-selector>p {
      text-align: center;
      color: #7f8c8d;
      margin-bottom: 25px;
    }

    .exam-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
    }

    .exam-card {
      background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
      border: 2px solid #3498db;
      border-radius: 12px;
      padding: 20px;
      cursor: pointer;
      transition: all 0.3s ease;
      text-align: center;
    }

    .exam-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 25px rgba(52, 152, 219, 0.3);
      background: linear-gradient(135deg, #3498db 0%, #2980b9 100%);
    }

    .exam-card:hover .exam-card-region,
    .exam-card:hover .exam-card-year,
    .exam-card:hover .exam-card-niveau {
      color: white;
    }

    .exam-card-region {
      font-size: 1.3rem;
      font-weight: 600;
      color: #2c3e50;
      margin-bottom: 8px;
    }

    .exam-card-year {
      font-size: 1.1rem;
      color: #3498db;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .exam-card-niveau {
      font-size: 0.9rem;
      color: #7f8c8d;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #3498db;
      color: white;
      padding: 10px 20px;
      border-radius: 25px;
      cursor: pointer;
      border: none;
      font-size: 0.95rem;
      margin-bottom: 20px;
      transition: background 0.3s;
    }

    .back-btn:hover {
      background: #2980b9;
    }

    .reset-btn {
      display: block;
      width: 100%;
      max-width: 800px;
      margin: 20px auto 0;
      padding: 15px;
      background: #e74c3c;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.3s;
    }

    .reset-btn:hover {
      background: #c0392b;
    }

    @media (max-width: 600px) {
      body {
        padding: 10px;
      }

      .entete {
        padding: 15px 20px;
      }

      .region {
        font-size: 1.1rem;
      }

      .annee {
        font-size: 1rem;
        padding: 4px 12px;
      }

      .texte {
        padding: 20px;
      }

      .texte p {
        font-size: 0.95rem;
        margin-bottom: 12px;
      }

      .toggle-btn {
        padding: 10px 20px;
        font-size: 0.9rem;
      }

      .questions {
        padding: 0 20px 20px;
      }

      .qst {
        padding: 15px;
      }

      .text-qst {
        font-size: 0.9rem;
      }

      .icon-answer {
        width: 35px;
        height: 35px;
      }

      .answer-display {
        padding: 12px;
        font-size: 0.9rem;
      }

      .edit-icon {
        width: 28px;
        height: 28px;
      }

      .modal {
        padding: 20px;
      }

      .modal-title {
        font-size: 1rem;
      }

      .btn {
        padding: 8px 16px;
        font-size: 0.9rem;
      }

      .affirmation-row {
        padding: 8px 12px;
        gap: 10px;
      }

      .affirmation-text {
        font-size: 0.85rem;
      }

      .tf-toggle {
        width: 70px;
        height: 30px;
        font-size: 0.8rem;
      }

      .qst-short {
        padding: 12px 15px;
      }

      .qst-short-text {
        font-size: 0.9rem;
      }

      .qst-short .icon-answer {
        width: 32px;
        height: 32px;
      }

      .short-item-row {
        flex-wrap: wrap;
      }

      .short-item-text {
        font-size: 0.85rem;
      }

      .short-item-answer-row {
        width: 100%;
        justify-content: space-between;
      }
    }
  </style>
</head>

<body>
  <div class="exam-selector" id="examSelector">
    <h2>📚 Banque d'Examens de Français</h2>
    <p>Sélectionnez un examen pour commencer :</p>
    <div class="exam-list" id="examList"></div>
  </div>

  <div class="exam-container" id="examContainer" style="display: none;">
    <button class="back-btn" onclick="goBackToSelector()">
      <i class="fas fa-arrow-left"></i> Retour aux examens
    </button>
    <div class="entete">
      <div class="region" id="region"></div>
      <div class="annee" id="annee"></div>
    </div>

    <div class="texte" id="texteContainer"></div>

    <div class="toggle-container">
      <button class="toggle-btn" id="toggleQuestions">
        <i class="fa-regular fa-eye"></i>
        <span>Afficher les questions</span>
      </button>
    </div>

    <div class="questions" id="questionsContainer"></div>
    <button class="reset-btn" onclick="resetAllAnswers()">
      <i class="fas fa-trash-alt"></i> Effacer les réponses
    </button>
  </div>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <div class="modal-header">
        <span class="modal-title" id="modalTitle">Question 1</span>
        <button class="modal-close" onclick="closeModal()">&times;</button>
      </div>
      <textarea id="modalTextarea" placeholder="Écrivez votre réponse ici..."></textarea>
      <div class="modal-actions">
        <button class="btn btn-cancel" onclick="closeModal()">Annuler</button>
        <button class="btn btn-save" onclick="saveModalAnswer()">Enregistrer</button>
      </div>
    </div>
  </div>

  <script>
    const examsData = [
      {
        id: 1,
        region: "Fès-Meknès",
        annee: 2019,
        niveau: "1ère année BAC",
        texte: [
          "<strong>Texte 1 :</strong>",
          "- Je vous laisserai seuls pendant un mois. Je tâcherai de ne rien dépenser de mon salaire, il me sera possible de remettre l’atelier en marche dès mon retour. Un grand silence s’établit, un silence lourd, moite, huileux et noir comme la suie. J’étouffais. Je désirais de toutes mes forces qu’une porte claquât, qu’une voisine poussât un cri de joie ou un gémissement de douleur, que quelque événement extraordinaire survint pour rompre cette angoisse.",
          "<strong>Texte 2 :</strong>",
          "Après la lecture de l’arrêt de mort par le président : Le procureur général combattit l’avocat, et je l’écoutai avec une satisfaction stupide. Puis les juges sortirent, puis ils rentrèrent, et le président me lut mon arrêt. Condamné à mort ! dit la foule ; et, tandis qu’on m’emmenait, tout ce peuple se rua sur mes pas avec le fracas d’un édifice qui se démolit."
        ],
        questions: [
          { id: 1, type: "short", text: "Complétez le tableau suivant pour les deux textes :", items: ["Nom de l’auteur", "Titre de l’œuvre", "Genre littéraire", "Siècle"] },
          { id: 2, type: "normal", text: "Situez chaque texte dans l’œuvre dont il est extrait." },
          { id: 3, type: "normal", text: "Montrez que la foule n’a pas le même effet sur les deux personnages dans les deux textes." },
          { id: 4, type: "vrai_faux", text: "Répondez par vrai ou faux :", affirmations: ["Le narrateur du texte 1 ressent une solitude absolue.", "Le narrateur du texte 2 est indifférent à sa condamnation."] },
          { id: 5, type: "normal", text: "Relevez dans le texte 1 une comparaison montrant la densité du silence." },
          { id: 6, type: "normal", text: "Quelle est la réaction du peuple dans le texte 2 après la sentence ?" },
          { id: 7, type: "normal", text: "Relevez une métaphore dans le texte 2 décrivant la foule." },
          { id: 8, type: "normal", text: "Quel sentiment domine le narrateur du texte 1 face au départ de son père ?" },
          { id: 9, type: "normal", text: "Identifiez le niveau de langue utilisé par le narrateur du texte 2." },
          { id: 10, type: "normal", text: "Selon vous, la réaction de la foule dans le texte 2 est-elle humaine ? Justifiez." }
        ]
      },
      {
        id: 2,
        region: "Casablanca-Settat",
        annee: 2021,
        niveau: "1ère année BAC",
        texte: [
          "Tant que j'ai marché dans les galeries publiques du Palais de Justice, je me suis senti presque libre et à l'aise; mais toute ma résolution m'a abandonné quand on a ouvert devant moi des portes basses, des escaliers secrets, des couloirs intérieurs, de longs corridors étouffés et sourds... On m'a conduit au cabinet du directeur entre les mains duquel l'huissier m'a remis. C'était un échange. Le directeur l'a prié d'attendre un instant lui annonçant qu'il allait avoir du gibier à lui remettre."
        ],
        questions: [
          { id: 1, type: "short", text: "Complétez :", items: ["Auteur", "Œuvre", "Genre", "Chapitre"] },
          { id: 2, type: "normal", text: "Ce sentiment d'être libre a-t-il duré longtemps chez le narrateur ? Justifiez." },
          { id: 3, type: "normal", text: "Pour quelle raison conduit-on le condamné au cabinet du directeur ?" },
          { id: 4, type: "normal", text: "Comment sont considérés les prisonniers par le personnel de la prison ?" },
          { id: 5, type: "normal", text: "Quelle image l'auteur donne-t-il du personnel pénitencier ?" },
          { id: 6, type: "normal", text: "Pourquoi le narrateur ne s'est-il pas rendu compte qu'il n'était pas seul dans sa cellule ?" },
          { id: 7, type: "normal", text: "Quel sentiment le narrateur éprouve-t-il à l'égard de son nouveau compagnon ?" },
          { id: 8, type: "normal", text: "Dans quel niveau de langue s'exprime le 'friauche' ?" },
          { id: 9, type: "normal", text: "Relevez deux expressions montrant le dégoût du narrateur." },
          { id: 10, type: "normal", text: "Approuvez-vous l'attitude indifférente du prêtre envers le condamné ?" }
        ]
      },
      {
        id: 3,
        region: "Rabat-Salé-Kénitra",
        annee: 2022,
        niveau: "1ère année BAC",
        texte: [
          "<strong>Texte 1 :</strong>",
          "Nous avons pris le fatal quai. Je commençais à ne plus voir, à ne plus entendre. Toutes ces voix, toutes ces têtes aux fenêtres... cette foule où tous me connaissent et où je ne connais personne ; cette route pavée et murée de visages humains… j’étais ivre, stupide, insensé.",
          "<strong>Texte 2 :</strong>",
          "Antigone entre dans la pièce, poussée par les gardes... Antigone : Créon, je ne veux plus voir leurs visages, je ne veux plus entendre leurs cris, je ne veux plus voir personne ! Tu as ma mort maintenant, c’est assez."
        ],
        questions: [
          { id: 1, type: "short", text: "Tableau comparatif :", items: ["Auteur T1", "Auteur T2", "Œuvre T1", "Œuvre T2"] },
          { id: 2, type: "normal", text: "Situez le texte 2 dans l'œuvre Antigone." },
          { id: 3, type: "normal", text: "Pour quelle raison Antigone a-t-elle été condamnée à mort ?" },
          { id: 4, type: "normal", text: "Pourquoi l'auteur du texte 1 n'indique-t-il pas le motif du crime ?" },
          { id: 5, type: "normal", text: "Expliquez l'effet de la foule sur le narrateur du texte 1." },
          { id: 6, type: "normal", text: "Que cherche à produire l'emploi du pronom 'vous' dans le texte 1 ?" },
          { id: 7, type: "normal", text: "Expliquez l'expression 'C'est assez' dite par Antigone." },
          { id: 8, type: "normal", text: "Relevez une métaphore dans le texte 1 liée à la foule." },
          { id: 9, type: "normal", text: "Comparez la peur de la mort et la peur de la foule chez Antigone." },
          { id: 10, type: "normal", text: "Pensez-vous que la solitude est préférable à la foule dans les moments tragiques ?" }
        ]
      },
      {
        id: 4,
        region: "Tanger-Tétouan-Al Hoceïma",
        annee: 2018,
        niveau: "1ère année BAC",
        texte: [
          "Je me suis dit : Puisque j'ai le moyen d'écrire, pourquoi ne le ferais-je pas ? Mais quoi écrire ? Pris entre quatre murailles de pierre nue et froide... seul à seul avec une idée, une idée de crime et de châtiment, de meurtre et de mort! Est-ce que je puis avoir quelque chose à dire, moi qui n'ai plus rien à faire dans ce monde ?"
        ],
        questions: [
          { id: 1, type: "normal", text: "Quel est le projet que le narrateur décide d'entreprendre ?" },
          { id: 2, type: "normal", text: "Relevez quatre termes appartenant au champ lexical de l'écriture." },
          { id: 3, type: "normal", text: "La tâche de l'écriture est-elle facile pour le narrateur ? Justifiez." },
          { id: 4, type: "normal", text: "Quel type de phrases domine dans le premier paragraphe et pourquoi ?" },

        questions: [

      },
      {
        id: 10,
        region: "Guelmim-Oued Noun",
        annee: 2021,
        niveau: "1ère année BAC",

        ],
        questions: [
          { id: 1, type: "short", text: "Identifiez :", items: ["Auteur", "Œuvre", "Genre", "Narrateur"] },

          { id: 5, type: "normal", text: "Relevez une métaphore montrant le poids de la condamnation." },
          { id: 6, type: "normal", text: "Quel contraste le narrateur fait-il entre son passé et son présent ?" },
          { id: 7, type: "normal", text: "Relevez trois mots du champ lexical de la pensée." },
          { id: 8, type: "normal", text: "Pourquoi le temps semble-t-il s'écouler différemment pour lui ?" },
          { id: 9, type: "normal", text: "Quelle est la tonalité du premier paragraphe ?" },
          { id: 10, type: "normal", text: "L'isolement est-il la pire des tortures pour un condamné ? Justifiez." }
        ]
      }
    ];

    let currentExam = null;
    let questionsData = [];
    let currentQuestion = null;
    let currentItemIndex = null;

    const getStorageKey = () => 'examAnswers_' + (currentExam ? currentExam.id : 0);

    function getAnswers() {
      const data = localStorage.getItem(getStorageKey());
      const answers = data ? JSON.parse(data) : {};
      questionsData.forEach(q => {
        if (q.affirmations && !answers[q.id]) {
          answers[q.id] = new Array(q.affirmations.length).fill(false);
        }
      });
      return answers;
    }

    function resetAllAnswers() {
      if (!currentExam) return;
      if (!confirm('Voulez-vous vraiment effacer toutes les réponses ?')) return;
      localStorage.removeItem(getStorageKey());
      renderQuestions();
    }

    function saveAnswers(answers) {
      localStorage.setItem(getStorageKey(), JSON.stringify(answers));
    }

    function initExamSelector() {
      const examList = document.getElementById('examList');
      examList.innerHTML = examsData.map(exam => `
            <div class="exam-card" onclick="selectExam(${exam.id})">
              <div class="exam-card-region">${exam.region}</div>
              <div class="exam-card-year">${exam.annee}</div>
              <div class="exam-card-niveau">${exam.niveau}</div>
            </div>
          `).join('');
    }

    function selectExam(examId) {
      currentExam = examsData.find(e => e.id === Number(examId));
      if (!currentExam) return;

      questionsData = currentExam.questions;

      document.getElementById('examSelector').style.display = 'none';
      document.getElementById('examContainer').style.display = 'block';

      document.getElementById('region').textContent = currentExam.region;
      document.getElementById('annee').textContent = currentExam.annee;

      localStorage.removeItem(getStorageKey());

      const texteContainer = document.getElementById('texteContainer');
      texteContainer.innerHTML = currentExam.texte.map(p => `<p>${p}</p>`).join('');

      document.getElementById('questionsContainer').classList.add('visible');

      renderQuestions();
    }

    function goBackToSelector() {
      document.getElementById('examSelector').style.display = 'block';
      document.getElementById('examContainer').style.display = 'none';
      currentExam = null;
      questionsData = [];
    }

    function renderQuestions() {
      const container = document.getElementById('questionsContainer');
      const answers = getAnswers();

      container.innerHTML = questionsData.map(q => {
        if (q.affirmations) {
          return renderTrueFalseQuestion(q, answers);
        }
        if (q.type === 'short') {
          return renderShortQuestion(q, answers);
        }
        return renderNormalQuestion(q, answers);
      }).join('');

      localStorage.setItem(getStorageKey(), JSON.stringify(answers));
    }

    function renderTrueFalseQuestion(q, answers) {
      const savedAnswers = answers[q.id] || [];
      return `
            <div class="qst" data-id="${q.id}">
              <div class="qst-header">
                <p class="text-qst">${q.id}. ${q.text}</p>
              </div>
              <div class="affirmations-list">
                ${q.affirmations.map((aff, index) => {
        const val = savedAnswers[index] === true;
        const btnClass = val ? 'vrai' : 'faux';
        const btnText = val ? 'Vrai' : 'Faux';
        return `
                    <div class="affirmation-row">
                      <span class="affirmation-text">${aff}</span>
                      <button class="tf-toggle ${btnClass}" data-qid="${q.id}" data-idx="${index}" onclick="toggleTrueFalse(${q.id}, ${index})">${btnText}</button>
                    </div>
                  `;
      }).join('')}
              </div>
            </div>
          `;
    }

    function renderShortQuestion(q, answers) {
      const savedAnswers = answers[q.id] || {};
      if (q.items) {
        return `
              <div class="qst-short-container" data-id="${q.id}">
                <p class="text-qst">${q.id}. ${q.text}</p>
                <div class="short-items-list">
                  ${q.items.map((item, index) => {
          const answer = savedAnswers[index];
          return `
                      <div class="short-item-row">
                        <span class="short-item-text">${item}</span>
                        <div class="short-item-answer-row">
                          ${answer ? `<span class="short-item-answer">${answer}</span>` : '<span class="short-item-answer"></span>'}
                          <button class="short-item-btn" data-qid="${q.id}" data-idx="${index}" onclick="openShortModal(${q.id}, ${index})">
                            <i class="fa-solid fa-pen"></i>
                          </button>
                        </div>
                      </div>
                    `;
        }).join('')}
                </div>
              </div>
            `;
      }
      const answer = answers[q.id];
      return `
            <div class="qst-short" data-id="${q.id}">
              <div class="qst-short-row1">
                <span class="qst-short-text">${q.id}. ${q.text}</span>
              </div>
              <div class="qst-short-row2">
                ${answer ? `<span class="qst-short-answer">${answer}</span>` : ''}
                <div class="icon-answer" onclick="openModal(${q.id})"><i class="fa-regular fa-pen-to-square"></i></div>
              </div>
            </div>
          `;
    }

    function renderNormalQuestion(q, answers) {
      const hasAnswer = !!answers[q.id];
      return `
            <div class="qst" data-id="${q.id}">
              <div class="qst-header">
                <p class="text-qst">${q.id}. ${q.text}</p>
                ${!hasAnswer ? `<div class="icon-answer" onclick="openModal(${q.id})"><i class="fa-regular fa-pen-to-square"></i></div>` : ''}
              </div>
              <div class="answer-area ${hasAnswer ? 'visible' : ''}" id="answer-${q.id}">
                <div class="answer-display">
                  ${hasAnswer ? answers[q.id] : '<span class="no-answer">Pas de réponse</span>'}
                  <button class="edit-icon" onclick="openModal(${q.id})"><i class="fa-solid fa-pen"></i></button>
                </div>
              </div>
            </div>
          `;
    }

    function openModal(id) {
      const q = questionsData.find(q => q.id === id);
      if (q && q.affirmations) return;
      if (q && q.items) return;
      currentQuestion = id;
      currentItemIndex = null;
      const answers = getAnswers();
      const textarea = document.getElementById('modalTextarea');
      textarea.value = answers[id] || '';
      textarea.classList.toggle('short', q && q.type === 'short');
      textarea.maxLength = q && q.type === 'short' ? 100 : 10000;
      document.getElementById('modalTitle').textContent = 'Question ' + id;
      document.getElementById('modalOverlay').classList.add('visible');
      textarea.focus();
    }

    function closeModal() {
      document.getElementById('modalOverlay').classList.remove('visible');
      document.getElementById('modalTextarea').classList.remove('short');
      currentQuestion = null;
      currentItemIndex = null;
    }

    function openShortModal(questionId, itemIndex) {
      const q = questionsData.find(q => q.id === questionId);
      if (!q || !q.items) return;
      currentQuestion = questionId;
      currentItemIndex = itemIndex;
      const answers = getAnswers();
      const savedAnswers = answers[questionId] || {};
      const textarea = document.getElementById('modalTextarea');
      textarea.value = savedAnswers[itemIndex] || '';
      textarea.classList.add('short');
      textarea.maxLength = 100;
      document.getElementById('modalTitle').textContent = `${questionId}. ${q.items[itemIndex]}`;
      document.getElementById('modalOverlay').classList.add('visible');
      textarea.focus();
    }

    function toggleTrueFalse(questionId, index) {
      const answers = getAnswers();
      if (!answers[questionId]) {
        answers[questionId] = [];
      }
      const currentVal = answers[questionId][index] === true;
      answers[questionId][index] = !currentVal;
      saveAnswers(answers);

      const btn = document.querySelector(`[data-qid="${questionId}"][data-idx="${index}"]`);
      if (btn) {
        const newVal = answers[questionId][index] === true;
        btn.textContent = newVal ? 'Vrai' : 'Faux';
        btn.className = `tf-toggle ${newVal ? 'vrai' : 'faux'}`;
      }
    }

    function saveModalAnswer() {
      if (currentQuestion !== null) {
        const textarea = document.getElementById('modalTextarea');
        const q = questionsData.find(q => q.id === currentQuestion);
        const answers = getAnswers();
        const answerText = textarea.value.trim();

        if (currentItemIndex !== null && q && q.items) {
          if (!answers[currentQuestion]) answers[currentQuestion] = {};
          answers[currentQuestion][currentItemIndex] = answerText;
        } else {
          answers[currentQuestion] = answerText;
        }

        saveAnswers(answers);
        closeModal();
        renderQuestions();
      }
    }

    document.getElementById('toggleQuestions').addEventListener('click', function () {
      const container = document.getElementById('questionsContainer');
      const btn = this;
      const icon = btn.querySelector('i');
      const text = btn.querySelector('span');

      if (container.classList.contains('visible')) {
        container.classList.remove('visible');
        icon.className = 'fa-regular fa-eye';
        text.textContent = 'Afficher les questions';
      } else {
        container.classList.add('visible');
        icon.className = 'fa-regular fa-eye-slash';
        text.textContent = 'Masquer les questions';
      }
    });

    document.getElementById('modalOverlay').addEventListener('click', function (e) {
      if (e.target === this) closeModal();
    });

    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') closeModal();
    });

    initExamSelector();
  </script>
